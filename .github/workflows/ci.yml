name: FinOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-finops-lakehouse:
    name: Lint, FOCUS Pipeline Tests & CDK Synth (100% Offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20 for AWS CDK CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python & CDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm install --no-audit --no-fund

      - name: Run Ruff linter
        run: ruff check .

      - name: Run local CUR 2.0 -> FOCUS 1.0 & Anomaly Pipeline
        env:
          DEMO_MODE: "true"
        run: |
          python scripts/generate_cur_data.py
          python src/local_runner.py

      - name: Run pytest suite (CDK assertions, FOCUS compliance, Anomaly & Bedrock Advisor)
        env:
          DEMO_MODE: "true"
        run: pytest

      - name: Synthesize AWS CDK Stacks (Offline Validation)
        run: npx cdk synth --app "python3 infra/app.py" --quiet
